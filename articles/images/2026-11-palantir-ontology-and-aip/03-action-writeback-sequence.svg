<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1120" viewBox="0 0 1480 1120">
  <rect width="1480" height="1120" fill="#FAFBFC"/>
  <defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3D4F63"/>
  </marker>
  <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A8792"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B3A3A"/>
  </marker>
  <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6B4F"/>
  </marker>
</defs>
  <text x="40" y="36" font-family="Noto Sans CJK SC" font-size="20" fill="#1A2332" text-anchor="start" font-weight="bold">图 3  从智能体提议到 Action 写回：时序与失败补偿</text>
<text x="40" y="58" font-family="Noto Sans CJK SC" font-size="12" fill="#5A6570" text-anchor="start" font-weight="normal">模型只能提议。授权、写入和外部调用由受权代码执行。Writeback 与副作用的失败路径不同。</text>
<text x="40" y="90" font-family="Noto Sans CJK SC" font-size="12" fill="#5A6570" text-anchor="start" font-weight="normal">本图是说明性时序，不是实测跟踪。公开文档未把跨系统写成统一分布式事务，幂等、重试和对账需要在集成时单独设计。</text>
<text x="110" y="140" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="middle" font-weight="bold">调度员</text>
<line x1="110" y1="150" x2="110" y2="680" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="320" y="140" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="middle" font-weight="bold">智能体 / AIP</text>
<line x1="320" y1="150" x2="320" y2="680" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="530" y="140" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="middle" font-weight="bold">权限与提交条件</text>
<line x1="530" y1="150" x2="530" y2="680" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="740" y="140" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="middle" font-weight="bold">人工审批（可选）</text>
<line x1="740" y1="150" x2="740" y2="680" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="950" y="140" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="middle" font-weight="bold">Action 服务</text>
<line x1="950" y1="150" x2="950" y2="680" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="1160" y="140" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="middle" font-weight="bold">Ontology 对象</text>
<line x1="1160" y1="150" x2="1160" y2="680" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="1365" y="140" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="middle" font-weight="bold">外部 CMMS</text>
<line x1="1365" y1="150" x2="1365" y2="680" stroke="#D1D5DB" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="1365" y="200" font-family="Noto Sans CJK SC" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="normal">此列的外部调用</text>
<text x="1365" y="218" font-family="Noto Sans CJK SC" font-size="11" fill="#6B7280" text-anchor="middle" font-weight="normal">见下方路径 A / B</text>
<line x1="110" y1="180" x2="320" y2="180" stroke="#3D4F63" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="215.0" y="172" font-family="Noto Sans CJK SC" font-size="12" fill="#3D4F63" text-anchor="middle" font-weight="normal">报告设备 EQ-001 超温</text>
<line x1="320" y1="220" x2="1160" y2="220" stroke="#3D4F63" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="740.0" y="212" font-family="Noto Sans CJK SC" font-size="12" fill="#3D4F63" text-anchor="middle" font-weight="normal">读取对象、链接与规程</text>
<line x1="1160" y1="260" x2="320" y2="260" stroke="#2F6B4F" stroke-width="1.4" marker-end="url(#arrow-green)"/>
<text x="740.0" y="252" font-family="Noto Sans CJK SC" font-size="12" fill="#2F6B4F" text-anchor="middle" font-weight="normal">返回产线、库存、在岗技师</text>
<line x1="320" y1="305" x2="110" y2="305" stroke="#3D4F63" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="215.0" y="297" font-family="Noto Sans CJK SC" font-size="12" fill="#3D4F63" text-anchor="middle" font-weight="normal">提出：创建工单并派给 T-17</text>
<rect x="230" y="318" width="180" height="28" rx="8" ry="8" fill="#F3E9F0" stroke="#6B3D5E" stroke-width="1.2"/>
<text x="320.0" y="340" font-family="Noto Sans CJK SC" font-size="11" fill="#6B3D5E" text-anchor="middle" font-weight="normal">到此为止只是提议</text>
<line x1="110" y1="380" x2="950" y2="380" stroke="#3D4F63" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="530.0" y="372" font-family="Noto Sans CJK SC" font-size="12" fill="#3D4F63" text-anchor="middle" font-weight="normal">提交 Action「创建并派工」</text>
<line x1="950" y1="425" x2="530" y2="425" stroke="#3D4F63" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="740.0" y="417" font-family="Noto Sans CJK SC" font-size="12" fill="#3D4F63" text-anchor="middle" font-weight="normal">检查角色、状态、资质</text>
<rect x="20" y="445" width="200" height="56" rx="8" ry="8" fill="#FDECEC" stroke="#8B3A3A" stroke-width="1.2"/>
<text x="120.0" y="467" font-family="Noto Sans CJK SC" font-size="12" fill="#8B3A3A" text-anchor="middle" font-weight="normal">不通过：拒绝写入</text>
<text x="120.0" y="485" font-family="Noto Sans CJK SC" font-size="12" fill="#8B3A3A" text-anchor="middle" font-weight="normal">记录审计后结束</text>
<line x1="530" y1="470" x2="200" y2="470" stroke="#8B3A3A" stroke-width="1.4" marker-end="url(#arrow-red)" stroke-dasharray="5 3"/>
<text x="365.0" y="462" font-family="Noto Sans CJK SC" font-size="12" fill="#8B3A3A" text-anchor="middle" font-weight="normal">条件失败</text>
<line x1="530" y1="530" x2="950" y2="530" stroke="#3D4F63" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="740.0" y="522" font-family="Noto Sans CJK SC" font-size="12" fill="#3D4F63" text-anchor="middle" font-weight="normal">条件通过，高风险需人审</text>
<line x1="950" y1="575" x2="740" y2="575" stroke="#3D4F63" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="845.0" y="567" font-family="Noto Sans CJK SC" font-size="12" fill="#3D4F63" text-anchor="middle" font-weight="normal">送主管确认</text>
<rect x="630" y="590" width="220" height="36" rx="8" ry="8" fill="#FDECEC" stroke="#8B3A3A" stroke-width="1.2"/>
<text x="740.0" y="612" font-family="Noto Sans CJK SC" font-size="12" fill="#8B3A3A" text-anchor="middle" font-weight="normal">若拒绝：不写入，记审计</text>
<line x1="740" y1="655" x2="950" y2="655" stroke="#2F6B4F" stroke-width="1.4" marker-end="url(#arrow-green)"/>
<text x="845.0" y="647" font-family="Noto Sans CJK SC" font-size="12" fill="#2F6B4F" text-anchor="middle" font-weight="normal">批准派工</text>
<rect x="40" y="700" width="1400" height="350" rx="10" ry="10" fill="#FFFEFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="60" y="728" font-family="Noto Sans CJK SC" font-size="12" fill="#5A6570" text-anchor="start" font-weight="normal">外部写回不是自动发生的。须单独配置 webhook、连接器或 Function。平台内部的 writeback dataset 不等于已经写回 CMMS。</text>
<rect x="60" y="748" width="680" height="282" rx="8" ry="8" fill="#E8F2EA" stroke="#2F6B4F" stroke-width="1.3"/>
<text x="80" y="776" font-family="Noto Sans CJK SC" font-size="15" fill="#2F6B4F" text-anchor="start" font-weight="bold">路径 A  配置为 Writeback</text>
<text x="80" y="806" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">1. Action 先向 CMMS 发出创建工单请求。</text>
<text x="80" y="828" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">2. 使用稳定业务单号，避免重复提交生成两张单。</text>
<text x="80" y="850" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">3. CMMS 成功后，再修改 Ontology 中的对象并写日志。</text>
<text x="80" y="872" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">4. 若外部超时、失败或部分成功：默认不应提交对象修改。</text>
<text x="80" y="894" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">5. 仍需对账：外部已成功但响应丢失时，要用幂等查询确认。</text>
<text x="80" y="916" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal"></text>
<text x="80" y="938" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">降低「对象已改、源系统未改」的风险，</text>
<text x="80" y="960" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">但不自动保证两端最终一致。</text>
<rect x="760" y="748" width="660" height="282" rx="8" ry="8" fill="#FFF6EB" stroke="#8A4B2E" stroke-width="1.3"/>
<text x="780" y="776" font-family="Noto Sans CJK SC" font-size="15" fill="#8A4B2E" text-anchor="start" font-weight="bold">路径 B  配置为副作用（默认）</text>
<text x="780" y="806" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">1. Action 先在 Ontology 中修改对象，事务提交。</text>
<text x="780" y="828" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">2. 然后再调用 CMMS。</text>
<text x="780" y="850" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">3. 若外部调用失败：对象已改，必须补偿或重试。</text>
<text x="780" y="872" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">4. 补偿可以是撤销对象变更，或进入人工对账清单。</text>
<text x="780" y="894" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">5. 重试同样要带幂等键，防止 CMMS 重复建单。</text>
<text x="780" y="916" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal"></text>
<text x="780" y="938" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">适合「对象层先记录决策、源系统稍后同步」，</text>
<text x="780" y="960" font-family="Noto Sans CJK SC" font-size="13" fill="#1A2332" text-anchor="start" font-weight="normal">失败处理成本更高，不能省略对账。</text>
<line x1="40" y1="1084" x2="1440" y2="1084" stroke="#C5CED6" stroke-width="1"/>
<text x="40" y="1104" font-family="Noto Sans CJK SC" font-size="11" fill="#6B7280" text-anchor="start" font-weight="normal">说明性时序图，依据官方 Action / webhook 文档整理，并补充集成时必须自建的失败处理。核查日期 2026-11-20（Asia/Shanghai）。</text>
</svg>
