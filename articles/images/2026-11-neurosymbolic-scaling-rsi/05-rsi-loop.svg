<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='640' viewBox='0 0 1100 640' font-family='Noto Sans CJK SC, Noto Sans CJK JP, sans-serif'><rect width='100%' height='100%' fill='#ffffff'/><text x='550.0' y='38' text-anchor='middle' font-size='24' font-weight='700' fill='#1f2937'>递归自我改进（RSI）：循环、层级与限制</text><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect x='208' y='70' width='224' height='80' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.6'/><text x='320.0' y='104.375' text-anchor='middle' font-size='15' font-weight='700' fill='#111827'>① 提出修改</text><text x='320.0' y='126.125' text-anchor='middle' font-size='13' font-weight='400' fill='#111827'>改提示、改代码、改数据或改权重</text><rect x='398' y='300' width='224' height='80' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.6'/><text x='510.0' y='334.375' text-anchor='middle' font-size='15' font-weight='700' fill='#111827'>② 评估</text><text x='510.0' y='356.125' text-anchor='middle' font-size='13' font-weight='400' fill='#111827'>基准、单测、证明器、人类评审</text><rect x='208' y='530' width='224' height='80' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.6'/><text x='320.0' y='564.375' text-anchor='middle' font-size='15' font-weight='700' fill='#111827'>③ 选择与保留</text><text x='320.0' y='586.125' text-anchor='middle' font-size='13' font-weight='400' fill='#111827'>只保留验证通过的版本</text><rect x='23' y='300' width='224' height='80' rx='10' fill='#eef2ff' stroke='#4f46e5' stroke-width='1.6'/><text x='135.0' y='334.375' text-anchor='middle' font-size='15' font-weight='700' fill='#111827'>④ 部署新版本</text><text x='135.0' y='356.125' text-anchor='middle' font-size='13' font-weight='400' fill='#111827'>新版本负责下一轮修改</text><line x1='420' y1='150' x2='490' y2='298' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><line x1='490' y1='382' x2='420' y2='528' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><line x1='215' y1='528' x2='150' y2='382' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><line x1='150' y1='298' x2='215' y2='150' stroke='#6b7280' stroke-width='1.8' marker-end='url(#a)'/><text x='322' y='335' text-anchor='middle' font-size='16' font-weight='700' fill='#4f46e5'>改进循环</text><text x='322' y='358' text-anchor='middle' font-size='12.5' fill='#374151'>「修改者」也被修改，</text><text x='322' y='376' text-anchor='middle' font-size='12.5' fill='#374151'>才算递归自我改进</text><text x='840' y='80' text-anchor='middle' font-size='16' font-weight='700' fill='#111827'>自我改进的层级（由浅到深）</text><rect x='660' y='100' width='360' height='72' rx='10' fill='#dcfce7' stroke='#16a34a' stroke-width='1.6'/><text x='840.0' y='130.375' text-anchor='middle' font-size='15' font-weight='700' fill='#111827'>提示/记忆层</text><text x='840.0' y='152.125' text-anchor='middle' font-size='13' font-weight='400' fill='#111827'>Self-Refine、Reflexion、Voyager 技能库</text><rect x='660' y='188' width='360' height='72' rx='10' fill='#dbeafe' stroke='#2563eb' stroke-width='1.6'/><text x='840.0' y='218.375' text-anchor='middle' font-size='15' font-weight='700' fill='#111827'>代码/流程层</text><text x='840.0' y='240.125' text-anchor='middle' font-size='13' font-weight='400' fill='#111827'>AlphaEvolve、Darwin Gödel Machine</text><rect x='660' y='276' width='360' height='72' rx='10' fill='#fef3c7' stroke='#d97706' stroke-width='1.6'/><text x='840.0' y='306.375' text-anchor='middle' font-size='15' font-weight='700' fill='#111827'>数据/权重层</text><text x='840.0' y='328.125' text-anchor='middle' font-size='13' font-weight='400' fill='#111827'>AlphaZero 自博弈、STaR 自训练</text><rect x='660' y='364' width='360' height='72' rx='10' fill='#fee2e2' stroke='#dc2626' stroke-width='1.6'/><text x='840.0' y='394.375' text-anchor='middle' font-size='15' font-weight='700' fill='#111827'>研究全流程层</text><text x='840.0' y='416.125' text-anchor='middle' font-size='13' font-weight='400' fill='#111827'>全自动 AI 研发，安全框架设的阈值</text><text x='840' y='478' text-anchor='middle' font-size='16' font-weight='700' fill='#111827'>限制循环速度的因素</text><text x='680' y='510' font-size='13' fill='#374151'>· 评估器的可靠性（会被「刷分」）</text><text x='680' y='535' font-size='13' fill='#374151'>· 真实数据与算力</text><text x='680' y='560' font-size='13' fill='#374151'>· 模型崩溃：只用自产数据训练会退化</text><text x='680' y='585' font-size='13' fill='#374151'>· 安全阈值：达到后要求暂停或加强防护</text><text x='550.0' y='628' text-anchor='middle' font-size='12' fill='#6b7280'>HansenUp 原创示意图。例子出处见正文参考资料。</text></svg>