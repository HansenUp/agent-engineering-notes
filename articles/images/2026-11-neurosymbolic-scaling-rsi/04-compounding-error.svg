dc2626'>12.2%</text><circle cx='338.0' cy='172.24067555235308' r='4' fill='#9333ea'/><text x='346.0' y='190.24067555235308' font-size='12' fill='#9333ea'>78.5%</text><text x='740' y='290' font-size='12.5' fill='#374151'>公式：P(全对) = pⁿ，假设各步独立、</text><text x='740' y='312' font-size='12.5' fill='#374151'>错一步即整体失败、不能回退。</text><text x='740' y='334' font-size='12.5' fill='#374151'>虚线：每步有一个校验器，</text><text x='740' y='356' font-size='12.5' fill='#374151'>以 80% 概率发现错误并重试一次，</text><text x='740' y='378' font-size='12.5' fill='#374151'>单步成功率变为 p + (1−p)·r·p。</text><text x='740' y='400' font-size='12.5' fill='#374151'>参数为演示假设，不是测量值。</text><text x='500.0' y='605' text-anchor='middle' font-size='12' fill='#6b7280'>曲线由公式直接计算。HansenUp 原创示意图。</text></svg>