<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='560' viewBox='0 0 1100 560' font-family='Noto Sans CJK SC, Noto Sans CJK JP, sans-serif'><rect width='100%' height='100%' fill='#ffffff'/><text x='550.0' y='38' text-anchor='middle' font-size='24' font-weight='700' fill='#1f2937'>Kautz 的六类神经符号系统</text><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#6b7280'/></marker></defs><rect x='40' y='70' width='50' height='40' fill='#1f2937'/><text x='65.0' y='96' text-anchor='middle' font-size='14' fill='#fff' font-weight='700'>#</text><rect x='90' y='70' width='280' height='40' fill='#1f2937'/><text x='230.0' y='96' text-anchor='middle' font-size='14' fill='#fff' font-weight='700'>Kautz 类型</text><rect x='370' y='70' width='330' height='40' fill='#1f2937'/><text x='535.0' y='96' text-anchor='middle' font-size='14' fill='#fff' font-weight='700'>含义（本文转述）</text><rect x='700' y='70' width='360' height='40' fill='#1f2937'/><text x='880.0' y='96' text-anchor='middle' font-size='14' fill='#fff' font-weight='700'>典型例子（部分为本文归类）</text><rect x='40' y='110' width='50' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='65.0' y='146' text-anchor='middle' font-size='13.5' font-weight='700' fill='#111827'>1</text><rect x='90' y='110' width='280' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='230.0' y='146' text-anchor='middle' font-size='14' font-weight='700' fill='#111827'>Symbolic Neuro Symbolic</text><rect x='370' y='110' width='330' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='535.0' y='146' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>符号进，神经网络处理，符号出</text><rect x='700' y='110' width='360' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='880.0' y='146' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>大多数 NLP 模型、LLM 的输入输出</text><rect x='40' y='172' width='50' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='65.0' y='208' text-anchor='middle' font-size='13.5' font-weight='700' fill='#111827'>2</text><rect x='90' y='172' width='280' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='230.0' y='208' text-anchor='middle' font-size='14' font-weight='700' fill='#111827'>Symbolic[Neuro]</text><rect x='370' y='172' width='330' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='535.0' y='208' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>符号求解器调用神经网络作子程序</text><rect x='700' y='172' width='360' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='880.0' y='208' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>AlphaGo：MCTS + 价值/策略网络</text><rect x='40' y='234' width='50' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='65.0' y='270' text-anchor='middle' font-size='13.5' font-weight='700' fill='#111827'>3</text><rect x='90' y='234' width='280' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='230.0' y='270' text-anchor='middle' font-size='14' font-weight='700' fill='#111827'>Neuro | Symbolic</text><rect x='370' y='234' width='330' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='535.0' y='270' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>神经网络感知，符号系统推理</text><rect x='700' y='234' width='360' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='880.0' y='270' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>神经感知 + 规则引擎；LLM + 本体校验</text><rect x='40' y='296' width='50' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='65.0' y='332' text-anchor='middle' font-size='13.5' font-weight='700' fill='#111827'>4</text><rect x='90' y='296' width='280' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='230.0' y='332' text-anchor='middle' font-size='14' font-weight='700' fill='#111827'>Neuro: Symbolic → Neuro</text><rect x='370' y='296' width='330' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='535.0' y='332' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>用符号知识生成训练数据或目标</text><rect x='700' y='296' width='360' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='880.0' y='332' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>用符号推导数据训练网络；AlphaGeometry 的合成数据</text><rect x='40' y='358' width='50' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='65.0' y='394' text-anchor='middle' font-size='13.5' font-weight='700' fill='#111827'>5</text><rect x='90' y='358' width='280' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='230.0' y='394' text-anchor='middle' font-size='14' font-weight='700' fill='#111827'>Neuro_{Symbolic}</text><rect x='370' y='358' width='330' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='535.0' y='394' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>把逻辑规则编进网络结构或损失</text><rect x='700' y='358' width='360' height='62' fill='#ffffff' stroke='#e5e7eb'/><text x='880.0' y='394' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>LTN、KBANN、∂ILP</text><rect x='40' y='420' width='50' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='65.0' y='456' text-anchor='middle' font-size='13.5' font-weight='700' fill='#111827'>6</text><rect x='90' y='420' width='280' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='230.0' y='456' text-anchor='middle' font-size='14' font-weight='700' fill='#111827'>Neuro[Symbolic]</text><rect x='370' y='420' width='330' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='535.0' y='456' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>神经网络内部调用符号推理</text><rect x='700' y='420' width='360' height='62' fill='#f9fafb' stroke='#e5e7eb'/><text x='880.0' y='456' text-anchor='middle' font-size='13.5' font-weight='400' fill='#111827'>设想中的类 System 2 机制；LLM 调用求解器/代码</text><text x='550.0' y='510' text-anchor='middle' font-size='13' fill='#374151'>知识方程、大本体模型一类方案若落地为「LLM 抽取、符号推理、结果校验」，大致属于第 3 类；宣称的「可微符号模型」则对应第 5 类。</text><text x='550.0' y='540' text-anchor='middle' font-size='12' 