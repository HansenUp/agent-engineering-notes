<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#FAF7F2"/><rect x="0" y="0" width="1080" height="14" rx="0" fill="#D97706" stroke="none" stroke-width="2"/><text x="60" y="100" font-size="56" font-weight="800" fill="#1F2937" text-anchor="start">Agent Harness 演进路线图</text><text x="60" y="152" font-size="30" font-weight="400" fill="#6B7280" text-anchor="start">2020—2026 · 从评测夹具到常驻系统</text><rect x="50" y="196" width="980" height="247" rx="22" fill="#EEF1F5" stroke="none" stroke-width="2"/><rect x="50" y="196" width="12" height="247" rx="6" fill="#64748B" stroke="none" stroke-width="2"/><rect x="86" y="212" width="198.05440000000002" height="44" rx="22" fill="#64748B" stroke="none" stroke-width="2"/><text x="104" y="244" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">2020—2023</text><text x="304.0544" y="245" font-size="32" font-weight="800" fill="#64748B" text-anchor="start">前史：评测与原型</text><circle cx="106" cy="290" r="7" fill="#64748B" stroke="none" stroke-width="0"/><text x="130" y="300" font-size="26" font-weight="700" fill="#64748B" text-anchor="start">2020-08</text><text x="260" y="300" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">EleutherAI 创建 lm-evaluation-harness</text><circle cx="106" cy="345" r="7" fill="#64748B" stroke="none" stroke-width="0"/><text x="130" y="355" font-size="26" font-weight="700" fill="#64748B" text-anchor="start">2022-10</text><text x="260" y="355" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">ReAct 论文：推理与行动交替</text><circle cx="106" cy="400" r="7" fill="#64748B" stroke="none" stroke-width="0"/><text x="130" y="410" font-size="26" font-weight="700" fill="#64748B" text-anchor="start">2023-10</text><text x="260" y="410" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">SWE-bench：2,294 个真实 issue</text><rect x="50" y="457" width="980" height="302" rx="22" fill="#E3F2FB" stroke="none" stroke-width="2"/><rect x="50" y="457" width="12" height="302" rx="6" fill="#0284C7" stroke="none" stroke-width="2"/><rect x="86" y="473" width="110.24640000000001" height="44" rx="22" fill="#0284C7" stroke="none" stroke-width="2"/><text x="104" y="505" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">2024</text><text x="216.2464" y="506" font-size="32" font-weight="800" fill="#0284C7" text-anchor="start">Scaffold 期：比的是脚手架</text><circle cx="106" cy="551" r="7" fill="#0284C7" stroke="none" stroke-width="0"/><text x="130" y="561" font-size="26" font-weight="700" fill="#0284C7" text-anchor="start">05</text><text x="260" y="561" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">SWE-agent 提出 ACI（Agent-计算机接口）</text><circle cx="106" cy="606" r="7" fill="#0284C7" stroke="none" stroke-width="0"/><text x="130" y="616" font-size="26" font-weight="700" fill="#0284C7" text-anchor="start">08</text><text x="260" y="616" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">SWE-bench Verified：500 题人工筛选</text><circle cx="106" cy="661" r="7" fill="#0284C7" stroke="none" stroke-width="0"/><text x="130" y="671" font-size="26" font-weight="700" fill="#0284C7" text-anchor="start">11</text><text x="260" y="671" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">Anthropic 发布 MCP 协议</text><circle cx="106" cy="716" r="7" fill="#0284C7" stroke="none" stroke-width="0"/><text x="130" y="726" font-size="26" font-weight="700" fill="#0284C7" text-anchor="start">12</text><text x="260" y="726" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">《Building effective agents》</text><rect x="50" y="773" width="980" height="302" rx="22" fill="#E2F5EE" stroke="none" stroke-width="2"/><rect x="50" y="773" width="12" height="302" rx="6" fill="#059669" stroke="none" stroke-width="2"/><rect x="86" y="789" width="110.24640000000001" height="44" rx="22" fill="#059669" stroke="none" stroke-width="2"/><text x="104" y="821" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">2025</text><text x="216.2464" y="822" font-size="32" font-weight="800" fill="#059669" text-anchor="start">Context 期：比的是上下文</text><circle cx="106" cy="867" r="7" fill="#059669" stroke="none" stroke-width="0"/><text x="130" y="877" font-size="26" font-weight="700" fill="#059669" text-anchor="start">02</text><text x="260" y="877" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">Claude Code 研究预览</text><circle cx="106" cy="922" r="7" fill="#059669" stroke="none" stroke-width="0"/><text x="130" y="932" font-size="26" font-weight="700" fill="#059669" text-anchor="start">06</text><text x="260" y="932" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">Tobi、Karpathy 推「context engineering」</text><circle cx="106" cy="977" r="7" fill="#059669" stroke="none" stroke-width="0"/><text x="130" y="987" font-size="26" font-weight="700" fill="#059669" text-anchor="start">09</text><text x="260" y="987" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">上下文工程长文；SDK 更名 Agent SDK</text><circle cx="106" cy="1032" r="7" fill="#059669" stroke="none" stroke-width="0"/><text x="130" y="1042" font-size="26" font-weight="700" fill="#059669" text-anchor="start">10</text><text x="260" y="1042" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">Agent Skills 发布（12 月成开放标准）</text><rect x="50" y="1089" width="980" height="357" rx="22" fill="#FCF1DF" stroke="none" stroke-width="2"/><rect x="50" y="1089" width="12" height="357" rx="6" fill="#D97706" stroke="none" stroke-width="2"/><rect x="86" y="1105" width="287.1168" height="44" rx="22" fill="#D97706" stroke="none" stroke-width="2"/><text x="104" y="1137" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">2025.11—2026.04</text><text x="393.1168" y="1138" font-size="32" font-weight="800" fill="#D97706" text-anchor="start">Harness 期：harness 成为通用词</text><circle cx="106" cy="1183" r="7" fill="#D97706" stroke="none" stroke-width="0"/><text x="130" y="1193" font-size="26" font-weight="700" fill="#D97706" text-anchor="start">25-11</text><text x="260" y="1193" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">Anthropic：长任务 harness</text><circle cx="106" cy="1238" r="7" fill="#D97706" stroke="none" stroke-width="0"/><text x="130" y="1248" font-size="26" font-weight="700" fill="#D97706" text-anchor="start">26-01</text><text x="260" y="1248" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">Anthropic 评测文章：harness ≈ scaffold</text><circle cx="106" cy="1293" r="7" fill="#D97706" stroke="none" stroke-width="0"/><text x="130" y="1303" font-size="26" font-weight="700" fill="#D97706" text-anchor="start">26-02</text><text x="260" y="1303" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">Hashimoto、OpenAI：harness engineering</text><circle cx="106" cy="1348" r="7" fill="#D97706" stroke="none" stroke-width="0"/><text x="130" y="1358" font-size="26" font-weight="700" fill="#D97706" text-anchor="start">26-03</text><text x="260" y="1358" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">LangChain「Agent = Model + Harness」</text><circle cx="106" cy="1403" r="7" fill="#D97706" stroke="none" stroke-width="0"/><text x="130" y="1413" font-size="26" font-weight="700" fill="#D97706" text-anchor="start">26-04</text><text x="260" y="1413" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">Managed Agents：会话、harness、沙箱解耦</text><rect x="50" y="1460" width="980" height="247" rx="22" fill="#ECEBFC" stroke="none" stroke-width="2"/><rect x="50" y="1460" width="12" height="247" rx="6" fill="#4F46E5" stroke="none" stroke-width="2"/><rect x="86" y="1476" width="213.73440000000002" height="44" rx="22" fill="#4F46E5" stroke="none" stroke-width="2"/><text x="104" y="1508" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">2026 下半年</text><text x="319.73440000000005" y="1509" font-size="32" font-weight="800" fill="#4F46E5" text-anchor="start">多 Agent 与常驻：DeepSeek 入场</text><circle cx="106" cy="1554" r="7" fill="#4F46E5" stroke="none" stroke-width="0"/><text x="130" y="1564" font-size="26" font-weight="700" fill="#4F46E5" text-anchor="start">08</text><text x="260" y="1564" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">DeepSeek Harness 开源；Cordis 论文</text><circle cx="106" cy="1609" r="7" fill="#4F46E5" stroke="none" stroke-width="0"/><text x="130" y="1619" font-size="26" font-weight="700" fill="#4F46E5" text-anchor="start">10-17</text><text x="260" y="1619" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">V4.1-Flash 写明为 DSH 优化</text><circle cx="106" cy="1664" r="7" fill="#4F46E5" stroke="none" stroke-width="0"/><text x="130" y="1674" font-size="26" font-weight="700" fill="#4F46E5" text-anchor="start">10-31</text><text x="260" y="1674" font-size="30" font-weight="500" fill="#1F2937" text-anchor="start">Super-agent 设计文章 + 研究原型</text><text x="540" y="1751" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">prompt 是一句话，context 是一屏，</text><text x="540" y="1797" font-size="32" font-weight="700" fill="#1F2937" text-anchor="middle">harness 是一台持续运转的机器。</text><line x1="60" y1="1840" x2="1020" y2="1840" stroke="#D6D3CD" stroke-width="2"/><text x="60" y="1882" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">阶段划分为笔者归纳；日期均据原始出处，见文末参考</text><text x="1020" y="1882" font-size="24" font-weight="700" fill="#1F2937" text-anchor="end">HansenUp</text></svg>