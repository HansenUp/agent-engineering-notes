<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#FAF7F2"/><rect x="0" y="0" width="1080" height="14" rx="0" fill="#D97706" stroke="none" stroke-width="2"/><text x="60" y="100" font-size="56" font-weight="800" fill="#1F2937" text-anchor="start">Harness 到底指哪一层</text><text x="60" y="152" font-size="30" font-weight="400" fill="#6B7280" text-anchor="start">三层嵌套：模型 ⊂ Agent Harness ⊂ 评测 / 生产外壳</text><rect x="50" y="200" width="980" height="700" rx="24" fill="#EEF1F5" stroke="#64748B" stroke-width="3" stroke-dasharray="10 8"/><text x="80" y="248" font-size="28" font-weight="700" fill="#64748B" text-anchor="start">Evaluation Harness：发题、起环境、打分、汇总</text><rect x="85" y="275" width="910" height="500" rx="22" fill="#FCF1DF" stroke="#D97706" stroke-width="3"/><text x="115" y="320" font-size="30" font-weight="800" fill="#D97706" text-anchor="start">被评测的 Agent = 模型 + Agent Harness</text><rect x="125" y="345" width="830" height="64" rx="32" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/><text x="540" y="388" font-size="30" font-weight="700" fill="#1F2937" text-anchor="middle">模型（权重不可改）</text><line x1="540" y1="409" x2="540" y2="438" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/><rect x="125" y="445" width="830" height="310" rx="18" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="150" y="488" font-size="26" font-weight="700" fill="#D97706" text-anchor="start">Agent Harness / Scaffold（两词同义）</text><rect x="150" y="510" width="380" height="72" rx="14" fill="#0284C7" stroke="none" stroke-width="2"/><text x="340.0" y="542" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Prompt 组装</text><text x="340.0" y="570" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="middle">系统提示、指令</text><rect x="550" y="510" width="380" height="72" rx="14" fill="#059669" stroke="none" stroke-width="2"/><text x="740.0" y="542" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Context 管理</text><text x="740.0" y="570" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="middle">压缩、记忆、检索</text><rect x="150" y="592" width="780" height="72" rx="14" fill="#D97706" stroke="none" stroke-width="2"/><text x="540.0" y="624" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Agent Loop</text><text x="540.0" y="652" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="middle">调模型 → 执行工具 → 回填结果 → 再调模型</text><rect x="150" y="674" width="380" height="72" rx="14" fill="#4F46E5" stroke="none" stroke-width="2"/><text x="340.0" y="706" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">工具注册表</text><text x="340.0" y="734" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="middle">内置工具、MCP、Skills</text><rect x="550" y="674" width="380" height="72" rx="14" fill="#64748B" stroke="none" stroke-width="2"/><text x="740.0" y="706" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">治理</text><text x="740.0" y="734" font-size="20" font-weight="400" fill="#FFFFFF" text-anchor="middle">权限、Hooks、审批</text><line x1="540" y1="775" x2="540" y2="800" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/><rect x="85" y="805" width="910" height="72" rx="18" fill="#E2F5EE" stroke="#059669" stroke-width="3"/><text x="540" y="852" font-size="28" font-weight="700" fill="#059669" text-anchor="middle">Runtime / 沙箱：工具调用真正执行的「手」</text><rect x="50" y="925" width="980" height="80" rx="18" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" stroke-dasharray="10 8"/><text x="540" y="975" font-size="26" font-weight="700" fill="#0284C7" text-anchor="middle">Agent 框架 / SDK：造 harness 的积木，不一定在运行时出现</text><text x="60" y="1066" font-size="34" font-weight="800" fill="#1F2937" text-anchor="start">同一个词，三种宽度</text><rect x="60" y="1092" width="470" height="74" rx="14" fill="#64748B" stroke="none" stroke-width="2"/><text x="80" y="1126" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">Anthropic 评测文章 · 最窄</text><text x="80" y="1158" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">处理输入、编排工具调用、返回结果</text><rect x="60" y="1178" width="640" height="74" rx="14" fill="#D97706" stroke="none" stroke-width="2"/><text x="80" y="1212" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">Claude Code 文档 · 居中 · 本文采用</text><text x="80" y="1244" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">提供工具、管理上下文的外围层</text><rect x="60" y="1264" width="960" height="74" rx="14" fill="#0284C7" stroke="none" stroke-width="2"/><text x="80" y="1298" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="start">LangChain · 最宽</text><text x="80" y="1330" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="start">不是模型的一切都是 harness</text><line x1="60" y1="1360" x2="1020" y2="1360" stroke="#D6D3CD" stroke-width="2"/><text x="60" y="1402" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">据 Anthropic、Claude Code 文档、LangChain 原文整理；宽窄比较为笔者观点</text><text x="1020" y="1402" font-size="24" font-weight="700" fill="#1F2937" text-anchor="end">HansenUp</text></svg>