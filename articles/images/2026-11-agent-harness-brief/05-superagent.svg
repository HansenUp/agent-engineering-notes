<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#FAF7F2"/><rect x="0" y="0" width="1080" height="14" rx="0" fill="#4F46E5" stroke="none" stroke-width="2"/><text x="60" y="100" font-size="56" font-weight="800" fill="#1F2937" text-anchor="start">Super-agent：省下人的注意力</text><text x="60" y="152" font-size="30" font-weight="400" fill="#6B7280" text-anchor="start">实线 = 原型已实现 · 虚线 = 仅见于官方文章</text><rect x="110" y="200" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/><text x="205.0" y="242.0" font-size="26" font-weight="700" fill="#4F46E5" text-anchor="middle">群聊</text><text x="205.0" y="272.0" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">原型：飞书，可选</text><rect x="320" y="200" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/><text x="415.0" y="242.0" font-size="26" font-weight="700" fill="#4F46E5" text-anchor="middle">GitHub</text><text x="415.0" y="272.0" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">原型已接入</text><rect x="530" y="200" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="3" stroke-dasharray="12 8"/><text x="625.0" y="242.0" font-size="26" font-weight="700" fill="#64748B" text-anchor="middle">邮件与日程</text><text x="625.0" y="272.0" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">仅文章设计</text><line x1="415" y1="292" x2="415" y2="326" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/><rect x="110" y="330" width="610" height="76" rx="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/><text x="415.0" y="377.0" font-size="26" font-weight="700" fill="#4F46E5" text-anchor="middle">两级过滤：程序 gate → 模型研判</text><line x1="415" y1="406" x2="415" y2="440" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/><rect x="110" y="444" width="610" height="104" rx="16" fill="#4F46E5" stroke="#4F46E5" stroke-width="3"/><text x="415.0" y="492.0" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Router（原型叫 main Session）</text><text x="415.0" y="522.0" font-size="21" font-weight="400" fill="#FFFFFF" text-anchor="middle">分派任务 · 积压的 Trigger 合并批处理</text><rect x="800" y="450" width="220" height="92" rx="16" fill="#FFFFFF" stroke="#D97706" stroke-width="3"/><text x="910.0" y="492.0" font-size="26" font-weight="700" fill="#D97706" text-anchor="middle">人</text><text x="910.0" y="522.0" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">单条回复 ≤100 词</text><line x1="720" y1="496" x2="796" y2="496" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/><line x1="415" y1="548" x2="415" y2="582" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/><rect x="110" y="586" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/><text x="205.0" y="628.0" font-size="26" font-weight="700" fill="#4F46E5" text-anchor="middle">Worker 1</text><text x="205.0" y="658.0" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">每 Ticket 一个会话</text><rect x="320" y="586" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/><text x="415.0" y="628.0" font-size="26" font-weight="700" fill="#4F46E5" text-anchor="middle">Worker 2</text><text x="415.0" y="658.0" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">每 Ticket 一个会话</text><rect x="530" y="586" width="190" height="92" rx="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/><text x="625.0" y="628.0" font-size="26" font-weight="700" fill="#4F46E5" text-anchor="middle">Worker N</text><text x="625.0" y="658.0" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">每 Ticket 一个会话</text><path d="M110,368 L66,368 L66,632 L104,632" fill="none" stroke="#4F46E5" stroke-width="3" marker-end="url(#ar)"/><text x="50" y="500" font-size="20" font-weight="700" fill="#4F46E5" text-anchor="middle" transform="rotate(-90 50 500)">订阅直通</text><rect x="800" y="586" width="220" height="92" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="3" stroke-dasharray="12 8"/><text x="910.0" y="628.0" font-size="26" font-weight="700" fill="#64748B" text-anchor="middle">Watchdog</text><text x="910.0" y="658.0" font-size="18" font-weight="400" fill="#6B7280" text-anchor="middle">原型仅每小时服务检查</text><line x1="796" y1="632" x2="724" y2="632" stroke="#64748B" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#ar)"/><line x1="415" y1="678" x2="415" y2="712" stroke="#6B7280" stroke-width="3" marker-end="url(#ar)"/><rect x="110" y="716" width="300" height="92" rx="16" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3"/><text x="260.0" y="758.0" font-size="26" font-weight="700" fill="#4F46E5" text-anchor="middle">执行：本机目录</text><text x="260.0" y="788.0" font-size="19" font-weight="400" fill="#6B7280" text-anchor="middle">原型现状（tmux + SQLite）</text><rect x="430" y="716" width="590" height="92" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="3" stroke-dasharray="12 8"/><text x="725.0" y="758.0" font-size="26" font-weight="700" fill="#64748B" text-anchor="middle">执行：云端 + BYOM 轻量 daemon</text><text x="725.0" y="788.0" font-size="19" font-weight="400" fill="#6B7280" text-anchor="middle">文章设计：计算、状态、环境分离</text><rect x="50" y="860" width="980" height="468" rx="20" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/><text x="80" y="912" font-size="30" font-weight="800" fill="#1F2937" text-anchor="start">任务完成时间（分钟）</text><text x="1000" y="912" font-size="20" font-weight="700" fill="#DC2626" text-anchor="end">官方原文 §7.1 · 仓库未收录</text><text x="80" y="970" font-size="24" font-weight="600" fill="#1F2937" text-anchor="start">Super-agent p50</text><rect x="80" y="984" width="269.0169491525424" height="40" rx="10" fill="#4F46E5" stroke="none" stroke-width="2"/><text x="363.0169491525424" y="1014" font-size="28" font-weight="800" fill="#4F46E5" text-anchor="start">12.4</text><text x="80" y="1070" font-size="24" font-weight="600" fill="#1F2937" text-anchor="start">Super-agent p95</text><rect x="80" y="1084" width="340.61016949152537" height="40" rx="10" fill="#4F46E5" stroke="none" stroke-width="2"/><text x="434.61016949152537" y="1114" font-size="28" font-weight="800" fill="#4F46E5" text-anchor="start">15.7</text><text x="80" y="1170" font-size="24" font-weight="600" fill="#1F2937" text-anchor="start">单 Session p95（中性提示）</text><rect x="80" y="1184" width="640.0" height="40" rx="10" fill="#64748B" stroke="none" stroke-width="2"/><text x="734.0" y="1214" font-size="28" font-weight="800" fill="#64748B" text-anchor="start">29.5</text><text x="80" y="1264.0" font-size="21" font-weight="400" fill="#6B7280" text-anchor="start">去掉直通：完成时间基本不变，但 Router 决定约 +30%，读缓存 token 2323 万 → 3177 万。合成</text><text x="80" y="1295.5" font-size="21" font-weight="400" fill="#6B7280" text-anchor="start">负载、编码用只耗时的工具代替，原文称仅作初步参考。</text><line x1="60" y1="1360" x2="1020" y2="1360" stroke="#D6D3CD" stroke-width="2"/><text x="60" y="1402" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">据官方文章与原型仓库 6337fc82 整理；研究原型，非 DeepSeek 正式产品</text><text x="1020" y="1402" font-size="24" font-weight="700" fill="#1F2937" text-anchor="end">HansenUp</text></svg>