<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker></defs><rect width="100%" height="100%" fill="#FAF7F2"/><rect x="0" y="0" width="1080" height="14" rx="0" fill="#D97706" stroke="none" stroke-width="2"/><text x="60" y="100" font-size="56" font-weight="800" fill="#1F2937" text-anchor="start">一个 Agent Harness 的 9 个部件</text><text x="60" y="152" font-size="30" font-weight="400" fill="#6B7280" text-anchor="start">左：部件 · 右上：职责 · 右下：在 Claude Code 里叫什么</text><rect x="50" y="200" width="980" height="112" rx="18" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/><rect x="50" y="200" width="300" height="112" rx="18" fill="#D97706" stroke="none" stroke-width="2"/><rect x="330" y="200" width="20" height="112" rx="0" fill="#D97706" stroke="none" stroke-width="2"/><text x="78" y="266" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">1</text><text x="118" y="266" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">Agent loop</text><text x="375" y="248" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">调模型→执行工具→回填结果，直到完成</text><text x="375" y="288" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">gather context → take action → verify results</text><rect x="50" y="324" width="980" height="112" rx="18" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/><rect x="50" y="324" width="300" height="112" rx="18" fill="#0284C7" stroke="none" stroke-width="2"/><rect x="330" y="324" width="20" height="112" rx="0" fill="#0284C7" stroke="none" stroke-width="2"/><text x="78" y="390" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">2</text><text x="118" y="390" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">工具层</text><text x="375" y="372" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">给模型可调用的能力，定义输入输出</text><text x="375" y="412" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">文件、搜索、执行、Web、代码智能五类内置工具</text><rect x="50" y="448" width="980" height="112" rx="18" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/><rect x="50" y="448" width="300" height="112" rx="18" fill="#059669" stroke="none" stroke-width="2"/><rect x="330" y="448" width="20" height="112" rx="0" fill="#059669" stroke="none" stroke-width="2"/><text x="78" y="514" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">3</text><text x="118" y="514" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">上下文管理</text><text x="375" y="496" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">决定窗口里放什么、何时压缩</text><text x="375" y="536" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">自动 compaction、/compact、MCP 工具延迟加载</text><rect x="50" y="572" width="980" height="112" rx="18" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/><rect x="50" y="572" width="300" height="112" rx="18" fill="#059669" stroke="none" stroke-width="2"/><rect x="330" y="572" width="20" height="112" rx="0" fill="#059669" stroke="none" stroke-width="2"/><text x="78" y="638" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">4</text><text x="118" y="638" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">记忆与指令</text><text x="375" y="620" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">跨会话保留项目知识与偏好</text><text x="375" y="660" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">CLAUDE.md、auto memory</text><rect x="50" y="696" width="980" height="112" rx="18" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/><rect x="50" y="696" width="300" height="112" rx="18" fill="#4F46E5" stroke="none" stroke-width="2"/><rect x="330" y="696" width="20" height="112" rx="0" fill="#4F46E5" stroke="none" stroke-width="2"/><text x="78" y="762" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">5</text><text x="118" y="762" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">子 Agent</text><text x="375" y="744" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">把子任务放进独立上下文</text><text x="375" y="784" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">subagents（内置 Explore、Plan 等）</text><rect x="50" y="820" width="980" height="112" rx="18" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/><rect x="50" y="820" width="300" height="112" rx="18" fill="#0284C7" stroke="none" stroke-width="2"/><rect x="330" y="820" width="20" height="112" rx="0" fill="#0284C7" stroke="none" stroke-width="2"/><text x="78" y="886" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">6</text><text x="118" y="886" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">扩展机制</text><text x="375" y="868" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">接入外部系统与能力包</text><text x="375" y="908" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">MCP、Skills、Plugins</text><rect x="50" y="944" width="980" height="112" rx="18" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/><rect x="50" y="944" width="300" height="112" rx="18" fill="#64748B" stroke="none" stroke-width="2"/><rect x="330" y="944" width="20" height="112" rx="0" fill="#64748B" stroke="none" stroke-width="2"/><text x="78" y="1010" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">7</text><text x="118" y="1010" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">生命周期 hooks</text><text x="375" y="992" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">在固定事件点插入确定性逻辑</text><text x="375" y="1032" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">PreToolUse、PostToolUse、Stop 等</text><rect x="50" y="1068" width="980" height="112" rx="18" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/><rect x="50" y="1068" width="300" height="112" rx="18" fill="#64748B" stroke="none" stroke-width="2"/><rect x="330" y="1068" width="20" height="112" rx="0" fill="#64748B" stroke="none" stroke-width="2"/><text x="78" y="1134" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">8</text><text x="118" y="1134" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">权限与沙箱</text><text x="375" y="1116" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">哪些操作可做、要审批、被禁止</text><text x="375" y="1156" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">权限模式、deny / ask / allow 规则、沙箱</text><rect x="50" y="1192" width="980" height="112" rx="18" fill="#FFFFFF" stroke="#D6D3CD" stroke-width="2"/><rect x="50" y="1192" width="300" height="112" rx="18" fill="#4F46E5" stroke="none" stroke-width="2"/><rect x="330" y="1192" width="20" height="112" rx="0" fill="#4F46E5" stroke="none" stroke-width="2"/><text x="78" y="1258" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="start">9</text><text x="118" y="1258" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="start">会话持久化</text><text x="375" y="1240" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">可恢复、可分叉、可审计</text><text x="375" y="1280" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">JSONL 会话 + checkpoint</text><line x1="60" y1="1360" x2="1020" y2="1360" stroke="#D6D3CD" stroke-width="2"/><text x="60" y="1402" font-size="22" font-weight="400" fill="#6B7280" text-anchor="start">据 Claude Code 官方文档整理（表 3 精简版）；配色仅作分组</text><text x="1020" y="1402" font-size="24" font-weight="700" fill="#1F2937" text-anchor="end">HansenUp</text></svg>